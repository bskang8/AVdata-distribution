<p>AV 지각·예측·계획 난이도로 정의한 <strong>11개 ODD 필드</strong>. 각 막대 = 값의 <strong>클립 비율</strong>(좌→우 빈도순, 100% 누적) · 지배값이 막대를 꽉 채울수록 편중이 심함.</p>

<blockquote>
<p><strong>표 분석</strong> — 11개 필드 <strong>모두 값이 등장</strong>하고 <code>lighting</code>·<code>junction_proximity</code>·<code>road_type</code>·<code>traffic_density</code>는 2~4개 값이 비교적 고르게 분포(채워짐). 반면 나머지 7개 필드는 <span class="danger">단일 지배값에 80~99.97% 쏠림</span>(clear 92% · low 99% · cars_only 97% · none 99.97% 등) — <strong>값은 있으나 다양성은 없는</strong> 구조. 특히 안전 크리티컬 값(high·absent·poor·VRU)은 막대에서 실선 수준으로만 존재 → 커버리지 저조의 직접 원인.</p>

<header>EXP-003 Phase 0 · 데이터 분포 진단</header>
<h2 id="2--odd-%EC%BB%A4%EB%B2%84%EB%A6%AC%EC%A7%80-%EC%A0%95%EB%9F%89%ED%99%94--%EB%8F%84%EC%B6%9C--%EA%B2%B0%EA%B3%BC">2 · ODD 커버리지 정량화 — 도출 &amp; 결과</h2>
<p><strong>질문</strong>: AV 안전성은 *&quot;마주칠 조건 조합을 얼마나 학습했나&quot;*에 좌우 → ODD를 이산 필드로 정의하고 <strong>관측 / 이론</strong> 조합 비율(커버율)을 측정.</p>
<div class="cols">
<div>
<p><strong>도출 4단계</strong></p>
<p><strong>①</strong> 클립 → 11-튜플 (각 클립 = 11필드 값 1튜플)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>(urban, clear, well_lit, cars_only, sparse,
 post_junction, dry, low, good, none, clear)

<div class="basis">
<b>표 작성 근거</b> — 각 등급은 <b>정량 + 정성의 결합</b>이다. &nbsp;<span class="h">정량 (코드로 검증)</span> = 관측 클립 수(step_a 실측) · 상위 100 조합 부재(analyze_top100). &nbsp;<span class="h">정성 (도메인 판단 · 코드 metric 없음)</span> = 안전 크리티컬 · 모델 실패 유발 · 취약 · 성능 저하 등 <b>심각도 서술 전부</b>.<br />
<span class="h">등급 부여</span>: 🔴 <b>최우선</b> = <b>[정성]</b> 안전 크리티컬 <b>+ [정량]</b> 상위 100(86%)에서조차 전무(고정 = occlusion=low·special_event=none뿐) · 🟠 <b>높음</b> = <b>[정성]</b> 모델 실패 취약 <b>+ [정량]</b> 관측 극소 · 🟡 <b>중간</b> = <b>[정성]</b> 성능 저하 <b>+ [정량]</b> 관측 존재(본 표 제외).<br />
<span class="v">※ 등급은 관측 수로 정하지 않음 — 🟠 snow(1,600)·fog(1,263)가 🟡 medium(807)·wet(414)보다 <b>데이터가 더 많은데도 더 높은 등급</b>. 즉 등급을 가르는 건 관측 수(정량)가 아니라 심각도(정성).</span> &nbsp; <span class="h">비고 열</span> = AV 성능 영향(정성) + 관측 상태(step_a 실측·정량, ~는 추정).
</div>

ass="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.52em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.168em;"><span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.8541em;"><span></span></span></span></span></span></span></span></span></span></p></div>
<div style="text-align:center;font-size:10pt;color:#001F60;margin:0 0 6px"><b>직관</b>: 각 클립을 <b>독립 클립 몇 개 분량</b>(0~1)으로 세어 더한 값.</div>
<div style="text-align:center;font-size:9.5pt;color:#5f6470;margin:0 0 14px">공통 뼈대는 <b>Σ wᵢ</b>, <b style="color:#001F60">차이는 wᵢ 계산법뿐</b> — soft = 평균 유사도 감점, hard = 근접복제(sim&gt;0.95) 개수 감점. count는 상위 K=20 중(자기 제외), 범위 <b>0~K</b> → hard wᵢ ∈ [1/21, 1].</div>
<div class="flow">
<p><span class="h">입력 &amp; 계산</span> — 임베딩 <strong>유사도만</strong> 사용 (ODD·캡션 텍스트 직접 안 씀)</p>
<p><strong>재료</strong>: <code>embeddings.npy</code> (N×1024, bge-m3 캡션 임베딩, L2 정규화)<br />
  → <strong>① k-NN</strong> (FAISS): 각 클립의 <strong>상위 20이웃 유사도</strong> 반환 (<em>평균 아직 X</em>) → <code>knn_sim</code> (N×K)<br />
  → <strong>② 집계</strong> (<code>knn_sim</code>만 입력): soft = 20이웃 유사도 <strong>평균</strong>, hard = <code>sim&gt;0.95</code> <strong>개수</strong></p>
<p><strong>예시</strong> (클립 #5, <code>knn_sim[5]=[0.98, 0.97, …, 0.91]</code>) — 같은 이웃, 두 방식:<br />
  <strong>soft</strong>: 20이웃 평균 0.945 → <code>w=1−0.945=</code><strong><code>0.055</code></strong>  ·  <strong>hard</strong>: <code>sim&gt;0.95</code> 이웃 3개 → <code>w=1/(1+3)=</code><strong><code>0.25</code></strong></p>
</div>
<blockquote>
<p><strong>요약</strong>: ① k-NN이 각 클립의 <em>가장 가까운 20개 이웃 + 유사도</em>를 찾음 → ② 그 20개로 wᵢ 계산 — <strong>soft</strong> = 유사도 <em>평균</em>으로 감점(연속), <strong>hard</strong> = 그 중 <code>sim&gt;0.95</code> <em>개수</em>로 감점(이진).</p>
</blockquote>
<div style="font-size:9pt;line-height:1.5;background:#f3f6fa;border:1px solid #d5dce6;border-radius:8px;padding:10px 13px;margin-top:14px">
<b style="color:#001F60">soft·hard는 같은 스케일</b> — 둘 다 <code>Σwᵢ</code>이고 wᵢ = "이 클립을 독립 클립 <b>몇 개</b>로 칠까"(0~1)로 의미가 같다. 완전 고유→wᵢ=1, 완전 중복→wᵢ≈0 으로 <b>끝점(눈금)이 동일</b> → 결과 단위가 같은 "독립 클립 수 ∈ [0,N]". 그래서 <b>6,021 vs 55,766 = 같은 분모의 6% vs 56%</b>, 직접 비교가 정당하다(차이는 오직 애매한 중간=회색지대 판정).
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-npfPZe08="" data-paginate="true" data-header="EXP-003 Phase 0 · 데이터 분포 진단" data-theme="byfk9lr6csfhaahzulu68zo669jpf7gc7vr6pgfzus5" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:EXP-003 Phase 0 · 데이터 분포 진단;--theme:byfk9lr6csfhaahzulu68zo669jpf7gc7vr6pgfzus5;" data-marpit-pagination-total="18">
<header>EXP-003 Phase 0 · 데이터 분포 진단</header>
<h2 id="3--effective-n--%EB%AA%A9%EC%A0%81--%EA%B2%B0%EA%B3%BC">3 · Effective N — 목적 &amp; 결과</h2>
<div class="stack">
<div class="purpose">
<span class="h">목적 — 왜 재나</span>&nbsp; <b>"10만 클립 = 실질 정보 몇 개 분량인가"</b> 정량화. 중복 많으면 클립 수↑라도 실질 정보량↓ → ① <b>유효 크기</b> 추정 ② <b>pruning 여지</b> 판단. 중복 기준 엄격도만 달리한 두 버전을 <b>범위</b>로 봄 — <b>Hard</b>=관대(상한, <code>sim&gt;0.95</code> 복제만) · <b>Soft</b>=엄격(하한, 평균 유사도 연속 감점). 격차 = 부드러운 중복량 진단.
</div>
<div class="hero">
<span class="lbl">결과 — 전체 100,398 클립의 실질 정보량</span>
<div class="stats">
<div class="stat"><div class="num soft">6.0%</div><div class="cap">Soft (엄격·하한)<br />Effective N = <b>6,021</b></div></div>
<div class="stat"><div class="num">56%</div><div class="cap">Hard (관대·상한)<br />Effective N = 55,766</div></div>
</div>
<div style="text-align:center;font-size:9pt;color:#5f6470;margin-top:8px;line-height:1.5"><b style="color:#c8871a">Soft</b> 기준 나머지 <b>94%</b>는 반복 정보 · <b style="color:#001F60">Hard</b> 기준 나머지 <b>44%</b>는 반복 정보</div>
<div class="why"><b>왜 6% ↔ 56%로 벌어지나</b> — 격차 <b>≈5만 클립</b> = '애매하게 닮은(near-중복)' 장면의 양. <b>차이는 판정 엄격도뿐</b>:
<ul>
<li><b style="color:#001F60">Hard</b>(관대) — 거의 똑같은 복사본(<code>sim&gt;0.95</code>)<b>만</b> 중복 처리 → <b>55,766</b> 남김</li>
<li><b style="color:#c8871a">Soft</b>(엄격) — <code>0.90~0.95</code> 미묘하게 닮은 장면까지 깎음 → <b>6,021</b> 남김</li>
<li>📷 <b>비유</b> — 연사(burst) 10장: Hard는 <b>10장</b> · Soft는 사실상 <b>1장</b>으로 셈</li>
<li><b>이 데이터셋</b> — '도심 직진'류 연사형 장면 수만 장 → Soft에서만 대량 필터 → 격차 발생</li>
</ul>
<span class="src">(Yao et al., <i>SoftDedup</i>, ACL 2024)</span></div>
</div>
<div class="lim">
<div><span class="t">⚠ 한계 — 단독으로 믿으면 안 되는 이유</span></div>
<ul>
<li><b>정체</b> — 각 클립이 <b>K=20 이웃만</b> 보는 <b>로컬</b> 통계</li>
<li><b>가능</b> "중복이 얼마나 많나(질량)" · <b>불가</b> "독립 덩어리가 몇 개인가(글로벌)"</li>
<li><b>약점</b> — K·유사도에 민감 → <b>클러스터 크기 ≈ K면 값 왜곡</b></li>
</ul>
<div class="ex"><b>예)</b> 거의 같은 클립 <b>21장</b> 그룹이 <b>4,762개</b>(총 10만) → 직관 답 "독립 ≈ 4,762". 그러나 K=20이면 각 클립이 <b>1−0.98=0.02장</b>으로만 세어져 합계 <b>≈2,000</b> = 참값(4,762)도 총수(10만)도 아닌 <b>K에 휘둘린 값</b>.</div>
<div style="margin-top:5px"><span class="sub">✔ 보완</span></div>
<ol>
<li><b>Vendi 병행(주)</b> — 글로벌 스펙트럼으로 "덩어리 몇 개"를 직접 포착. <i>Effective N을 단독으로 안 쓰는 이유.</i></li>
<li><b>K-민감도</b> — K=10/20/40으로 다시 세어 값이 크게 흔들리면 "클러스터 크기 ≈ K" 경고. <span class="hint">쉽게: 자(K)를 바꿨더니 잰 값이 달라지면 그 값은 못 믿는다.</span></li>
<li><b>그룹 수가 필요하면</b> — 유사도 τ 이상 닮은 클립끼리 사슬처럼 이어붙여 <b>덩어리 개수를 직접</b> 셈(연결요소). <span class="hint">쉽게: A~B, B~C면 A·C도 한 무리 — 친구의 친구까지 사슬로 이어 붙이면 연사 500장도 통째로 1덩어리.</span></li>
</ol>
<div class="concl"><b style="color:#001F60">결론</b> — 로컬(Effective N) <b>＋</b> 글로벌(Vendi)을 <b>반드시 함께</b>.</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-0s29Hsum="" data-paginate="true" data-header="EXP-003 Phase 0 · 데이터 분포 진단" data-theme="byfk9lr6csfhaahzulu68zo669jpf7gc7vr6pgfzus5" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:EXP-003 Phase 0 · 데이터 분포 진단;--theme:byfk9lr6csfhaahzulu68zo669jpf7gc7vr6pgfzus5;" data-marpit-pagination-total="18">
<header>EXP-003 Phase 0 · 데이터 분포 진단</header>
<h2 id="3--vendi--%EA%B3%84%EC%82%B0-%EC%9B%90%EB%A6%AC">3 · Vendi — 계산 원리</h2>
<div class="step">① 유사도 표(커널 K) 만들기</div>
<div class="k">
<ul>
<li><b>뽑기</b> — 10만 전부는 너무 커(10만² 불가) → <b>임의 2,000개 클립</b> 추출(<b>Nyström</b> 근사)</li>
<li><b>비교</b> — 2,000개 벡터(bge-m3, L2정규화)를 <b>서로서로 코사인 유사도</b> → <b>2000×2000 표 K</b></li>
<li><b>의미</b> — <code>K[i,j]</code> = "클립 i·j가 얼마나 닮았나" (1=똑같음 · 0=무관 · 대각선=자기=1)</li>
</ul>
<div class="kd">🔎 <b>직관</b>: K = "닮음 지도". 닮은 클립 많음 → 행/열 평행 → <b>랭크 낮음</b> → 다음 단계 <b>고유값 λ가 소수 축에 쏠림</b>. <span style="color:#8a8f98">(Effective N과 같은 임베딩, 보는 각도만: 개별 이웃 → 전체 스펙트럼)</span></div>
</div>
<div class="step">② 이 표 K에서 다양성 뽑기 <span class="sub">— 아래 수식으로 계산</span></div>
<div style="text-align:center;margin:2px 0 4px">
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>Vendi</mtext><mo>=</mo><mi>exp</mi><mo>⁡</mo><mtext> ⁣</mtext><mo fence="true" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>H</mi><mo stretchy="false">(</mo><mi mathvariant="bold">p</mi><mo stretchy="false">)</mo><mo fence="true" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo>=</mo><mi>exp</mi><mo>⁡</mo><mtext> ⁣</mtext><mo fence="true" stretchy="true" minsize="1.8em" maxsize="1.8em">(</mo><mo>−</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>p</mi><mi>i</mi></msub><mi>log</mi><mo>⁡</mo><msub><mi>p</mi><mi>i</mi></msub><mo fence="true" stretchy="true" minsize="1.8em" maxsize="1.8em">)</mo><mo separator="true">,</mo><mspace width="2em"/><msub><mi>p</mi><mi>i</mi></msub><mo>=</mo><mfrac><msub><mi>λ</mi><mi>i</mi></msub><mrow><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>λ</mi><mi>j</mi></msub></mrow></mfrac><mtext>  </mtext><mo stretchy="false">(</mo><mi>λ</mi><mo>=</mo><mtext>유사도 커널 </mtext><mi>K</mi><mtext>의 고유값</mtext><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\text{Vendi}=\exp\!\bigl(H(\mathbf p)\bigr)=\exp\!\Bigl(-\sum_i p_i\log p_i\Bigr),\qquad p_i=\frac{\lambda_i}{\sum_j \lambda_j}\ \ (\lambda=\text{유사도 커널 }K\text{의 고유값})
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord text"><span class="mord">Vendi</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mop">exp</span><span class="mspace" style="margin-right:-0.1667em;"></span><span class="mopen"><span class="delimsizing size1">(</span></span><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mopen">(</span><span class="mord mathbf">p</span><span class="mclose">)</span><span class="mclose"><span class="delimsizing size1">)</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.4277em;vertical-align:-1.2777em;"></span><span class="mop">exp</span><span class="mspace" style="margin-right:-0.1667em;"></span><span class="mopen"><span class="delimsizing size2">(</span></span><span class="mord">−</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop op-limits"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.05em;"><span style="top:-1.8723em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span><span style="top:-3.05em;"><span class="pstrut" style="height:3.05em;"></span><span><span class="mop op-symbol large-op">∑</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.2777em;"><span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em 04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal">λ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.1218em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace"> </span><span class="mspace"> </span><span class="mopen">(</span><span class="mord mathnormal">λ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord hangul_fallback">유사도</span><span class="mord"> </span><span class="mord hangul_fallback">커널</span><span class="mord"> </span></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="mord text"><span class="mord hangul_fallback">의</span><span class="mord"> </span><span class="mord hangul_fallback">고유값</span></span><span class="mclose">)</span></span></span></span></span></p></div>
<div class="bridge">
<div class="bt">K의 고유값 <b>λ</b>를 3토막으로 읽으면 위 수식이 곧 <b>"독립 방향 수"</b></div>
<div class="bg">
<div class="bs"><span class="n">λᵢ</span> : 방향별 <b>크기</b><div class="d">각 독립 축에 데이터가 퍼진 정도(에너지). 큰 λ = 그 방향에 데이터가 몰림.</div></div>
<div class="ar">→</div>
<div class="bs"><span class="n">pᵢ = λᵢ/Σλ</span> : 방향별 <b>비중</b><div class="d">합=1로 정규화 → "전체 다양성 중 이 방향이 차지하는 몫".</div></div>
<div class="ar">→</div>
<div class="bs"><span class="n">exp(H)</span> : <b>"균등 몇 개짜리와 맞먹나"</b>로 환산<div class="d">균등 4방향 → <b>4</b> · 한 방향 97% 쏠림 → <b>≈1</b> ⇒ <b>실제로 일하는 방향 수</b><span class="fn">∵ 지배항 ln0.97≈0 · 1%항은 비중에 눌림 ⇒ H≈0 ⇒ exp(H)≈1</span></div></div>
</div>
<div class="ba">🔑 <b>"균등하게 k개면 정확히 k"</b> → 그래서 exp(H)는 "실질적으로 몇 개 방향인가"를 재는 <b>soft 카운트</b>다. 주사위가 고르면 6, 한 눈에 쏠리면 ≈1로 나오는 <b>'유효 선택지 수'</b>와 같은 원리(= Hill number·유효 종 수).</div>
</div>
<div class="scale">📏 <b>Vendi 눈금</b> — 모든 클립 동일 → <b>1</b> · k개 독립 그룹(균등) → <b>k</b> · 2,000개 전부 독립 → <b>2000</b> &nbsp;|&nbsp; 고유값이 <b>소수에 쏠릴수록 값↓</b>(좁은 공간) · <b>고를수록 값↑</b>(넓은 커버리지)</div>
<div class="step">③ 안정화 <span class="sub">— 재현 가능한 값인가</span></div>
<div class="stab">앵커 2,000개를 다시 뽑아 여러 번 반복, run 간 <b>표준오차/평균 &lt; 2%</b>면 수렴 → 샘플링에 흔들리지 않는 안정값 (이번 3전략 모두 5회 만에 수렴, Sequential Stopping Rule).</div>
</section>

<header>EXP-003 Phase 0 · 데이터 분포 진단</header>
<h2 id="3--vendi--%EB%AA%A9%EC%A0%81--%EA%B2%B0%EA%B3%BC--%ED%95%B4%EC%84%9D">3 · Vendi — 목적 · 결과 · 해석</h2>
<div class="stack">
<div class="purpose">
<span class="h">목적 — 왜 재나</span>&nbsp; Effective N은 <b>중복 질량</b>(로컬)만 본다 → <b>"몇 개의 독립 의미 방향인가"(글로벌)</b>는 Vendi가 답. <b>같은 공식</b>에 앵커를 <b>3가지 방식</b>으로 뽑아, 다양성 부족의 원인을 <b>중복 vs 커버리지</b>로 분해한다.
</div>
<div class="hero">
<span class="lbl">결과 — Vendi 3전략 (독립 의미 방향 수)</span>
<div class="method">셋 다 <b>같은 Vendi 공식</b>(p11) · 다른 건 <b>앵커 2,000개를 어떻게 뽑나</b>뿐</div>
<div class="stats">
<div class="stat"><div class="num">3.53</div><div class="cap"><b>random</b> — 10만서 <b>균등 무작위</b> 2,000개<br />= 현재 분포(모델이 받는 다양성)</div></div>
<div class="stat"><div class="num">3.64</div><div class="cap"><b>dedup</b> — <b>고유성 가중</b> 뽑기(흔한↓·희귀↑)<br />= Effective N 가중치(w)를 반영한 분포</div></div>
<div class="stat"><div class="num up">4.75</div><div class="cap"><b>topk</b> — 고유성 <b>상위 풀</b>에서 2,000개<br />= <b>Effective N 상위 6,021개</b> (다양성 상한)</div></div>
</div>
<div style="text-align:center;font-size:9pt;color:#5f6470;margin-top:8px;line-height:1.5">억압계수 <b>1.030</b>(<code>dedup÷random</code>) — 중복 다 지워도 <b>+3.0%뿐</b> · 이상적 큐레이션 상한(topk)<b>조차 <span style="color:#1a7f5a">4.75</span></b></div>
<div class="why"><b>어떻게 읽나</b> — <b>진단 2단계 → 처방</b>으로 읽는다:
<ul>
<li><b>① 원인 배분</b> — 억압계수 <b>1.030</b>(<code>dedup÷random</code>) → 중복을 완전히 지워도 다양성은 <b>+3.0%뿐</b> → <b>중복은 범인이 아니다</b>.</li>
<li><b>② 낮은 천장</b> — 중복을 완벽히 지운 상한(topk)<b>조차 4.75</b>(이상적 AV셋은 수십~수백) → 고유 알맹이도 사실상 <b>3~5개 방향</b>('도심 직진' 지배)뿐.</li>
<li><b style="color:#1a7f5a">③ 처방</b> — 부분집합 재조정으론 천장을 못 올림 → <b>없는 시나리오를 새로 수집·합성</b>해야 다양성이 오른다.</li>
</ul>
<span class="src">① 진단(원인 배분) · ② 진단(천장 낮음) 이 함께여야 ③ 처방이 선다 · (Friedman &amp; Dieng, <i>Vendi Score</i>, TMLR 2023)</span></div>
</div>
<div class="merge">
<div><span class="t">🔗 Effective N과 병합 해석 — 로컬 고유성 ≠ 글로벌 다양성</span> &nbsp;개별 클립이 안 겹쳐도(로컬) 전체는 좁은 공간에 몰릴(글로벌) 수 있다. Eff N <b>6,021개조차</b> Vendi로 보면 <b>3~4방향</b>에만 집중.</div>
<table class="mtx">
<tr><th></th><th>Vendi 높음</th><th>Vendi 낮음</th></tr>
<tr><th>Eff N 높음</th><td>✅ 이상적</td><td>⚠ 좁은 공간에 퍼짐</td></tr>
<tr><th>Eff N 낮음</th><td>⚠ 방향만 있고 빈약</td><td class="bad">❌ 이번 데이터셋</td></tr>
</table>
<div class="concl"><b style="color:#001F60">결론</b> — 두 지표가 같은 진단(극히 좁은 공간 집중). <b>로컬(Effective N) ＋ 글로벌(Vendi)을 반드시 함께</b> 봐야 "중복 vs 커버리지"를 갈라 처방할 수 있다.</div>
</div>
</div>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-kuzQjLqV="" data-paginate="true" data-header="EXP-003 Phase 0 · 데이터 분포 진단" data-theme="byfk9lr6csfhaahzulu68zo669jpf7gc7vr6pgfzus5" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header:EXP-003 Phase 0 · 데이터 분포 진단;--theme:byfk9lr6csfhaahzulu68zo669jpf7gc7vr6pgfzus5;" data-marpit-pagination-total="18">
<header>EXP-003 Phase 0 · 데이터 분포 진단</header>
<h2 id="%EB%B6%80%EB%A1%9D-a--vendi-3%EC%A0%84%EB%9E%B5--%EC%95%B5%EC%BB%A4-2000%EA%B0%9C-%EB%BD%91%EB%8A%94-%EB%B2%95">부록 A · Vendi 3전략 — 앵커 2,000개 뽑는 법</h2>
<div class="lead">세 전략은 <b>모두 같은 Vendi 공식</b>(=커널 고유값 엔트로피) · 다른 건 <b>어떤 2,000개를 앵커로 뽑느냐</b>뿐. <code>rng.choice(N, 2000, replace=False, p=?)</code>의 <b>p</b>(뽑힐 확률)만 달라진다.</div>
<table class="cmp">
<tr><th>전략</th><th>앵커 뽑는 법 (<span class="s">p</span>)</th><th>뜻</th></tr>
<tr><td><b>random</b></td><td><span class="s">p=None</span> — 10만 전체서 <b>균등</b> 무작위</td><td>현재 분포 그대로</td></tr>
<tr><td><b>dedup</b></td><td><span class="s">p ∝ 고유성 w</span> — 가중 추출</td><td>Effective N 가중치(w) 반영 분포</td></tr>
<tr><td><b>topk</b></td><td>상위 6,021개 <b>풀</b> → 그 안에서 <span class="s">균등</span></td><td>Effective N 상위 6,021개 (다양성 상한)</td></tr>
</table>
<div class="mbox">
<div class="mh">① dedup — 각 클립에 <span style="color:#001F60">w</span>를 매기고, w에 비례해 뽑는다</div>
<ul>
<li><b>w 계산</b> — 클립마다 <code>w = 1 − (상위 20이웃 평균 유사도)</code> (Effective N 값 재사용). 중복 <code>w≈0</code> · 희귀 <code>w≈1</code>.</li>
<li><b>확률화</b> — <code>p = w / Σw</code> → <b>10만 클립 각자 확률 하나</b> = 길이 10만 벡터 <code>probs</code> (합=1).</li>
<li><b>뽑기</b> — <code>rng.choice(N, 2000, replace=False, p=probs)</code> → w 큰(희귀) 클립이 대부분 뽑힘.</li>
</ul>
<table class="ex">
<tr><th>클립 예</th><th>이웃 평균 유사도</th><th>w = 1−유사도</th><th>뽑힐 확률 (막대 ∝ w)</th></tr>
<tr><td class="l">중복 클립</td><td>0.98</td><td>0.02</td><td class="l"><span class="bar">▏</span>거의 0</td></tr>
<tr><td class="l">보통 클립</td><td>0.60</td><td>0.40</td><td class="l"><span class="bar">████</span>중간</td></tr>
<tr><td class="l">희귀 클립</td><td>0.05</td><td>0.95</td><td class="l"><span class="bar">█████████▌</span>높음</td></tr>
</table>
<div class="ins">🎟 <b>직관</b>: 고유성만큼 <b>제비를 나눠주고</b> 2,000장 뽑는 셈 → 중복은 제비가 거의 없어 안 뽑힘. 삭제가 아니라 <b>확률로 눌러</b> "중복 제거된 셋에서 뽑은 것"과 동등 = <b>SoftDedup</b>.</div>
</div>
<div class="mbox">
<div class="mh">② topk — "고유성 상위 6,021개 풀"은 어떻게?</div>
<ul>
<li><b>1단계 풀 만들기</b> — 고유성 <code>w</code> <b>상위 6,021개</b>(= Effective N 개수) 클립만 골라 <b>고정 풀</b>로 추출 → "실질적으로 독립인 클립"만 모은 집합.</li>
<li><b>2단계 뽑기</b> — 그 풀(6,021) 안에서 <b>균등 무작위 2,000개</b> (<code>p=None</code>).</li>
</ul>
<div class="ins">🏔 <b>직관</b>: 가장 고유한 클립만 남긴 <b>정예 집합</b>에서 잰 다양성 → "이상적으로 중복을 다 걷어냈을 때 도달 가능한 <b>상한</b>". 그래서 topk(4.75) &gt; dedup(3.64) &gt; random(3.53).</div>
</div>
</section>

<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>

<h1 id="0--phase-1%EC%9D%98-%EB%AA%A9%EC%A0%81">0 · Phase 1의 목적</h1>
<h3 id="egomotion-%EC%A0%90%EC%88%98%EA%B0%80-%EB%AA%A9%EC%A0%81%EC%9D%B4-%EC%95%84%EB%8B%88%EB%9D%BC--%EA%B7%B8-%EC%98%88%EC%B8%A1%EC%98%A4%EC%B0%A8%EB%A5%BC-%EC%9E%90%EB%A1%9C-%EC%82%BC%EC%95%84">egomotion <strong>점수</strong>가 목적이 아니라 — 그 예측오차를 <strong>자로 삼아</strong>:</h3>
<h3 id="%E2%91%A0-%EC%88%98%EC%A7%91-%EA%B0%80%EC%9D%B4%EB%93%9C%EB%A5%BC-%EC%96%B4%EB%96%BB%EA%B2%8C-%EC%84%A4%EA%B3%84%ED%95%A0%EC%A7%80-%EC%9B%90%EB%A6%AC%EB%A5%BC-%EB%8F%84%EC%B6%9C%ED%95%98%EA%B3%A0-%E2%91%A1-%EA%B7%B8-%EC%84%A4%EA%B3%84%EC%97%90-odd%EC%9E%84%EB%B2%A0%EB%94%A9%EC%9D%84-%EC%93%B0%EB%8A%94-%EA%B2%8C-%ED%83%80%EB%8B%B9%ED%95%9C%EC%A7%80-%EC%8B%A4%EC%B8%A1%ED%95%9C%EB%8B%A4">① <strong>수집 가이드를 어떻게 설계할지</strong> 원리를 도출하고 ② 그 설계에 <strong>ODD·임베딩을 쓰는 게 타당한지</strong> 실측한다</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-wZjrIvw6="" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="0--%ED%95%9C%EB%88%88%EC%97%90--%EB%AA%A9%EC%A0%81--%EC%8B%A4%ED%97%98-%EA%B3%84%ED%9A%8D--%EB%8B%A4%EC%9D%8C-%EC%88%98%ED%96%89">0 · 한눈에 — 목적 · 실험 계획 · 다음 수행</h2>
<div class="ov">
<div class="sec goal">
<div class="lbl"><span class="tag">목적</span>정해진 예산(<b>≈5천 클립</b>)에서 성능이 가장 오르는 <b>데이터 수집 가이드</b>를 제시</div>
<span class="q">Q1</span> ODD·임베딩을 쓰는 게 <b>타당한가</b>(두 잣대 검증) &nbsp;→&nbsp; <span class="q">Q2</span> 타당하면 이 둘로 <b>어떻게 가이드를 짜나</b>(설계 원리)
</div>
<div class="sec plan">
<div class="lbl"><span class="tag">계획</span><b>target 조건</b>을 <b>ablation</b>해 결핍을 유도하고, <b>acquisition 정책</b>별로 보충·재학습하여 회복량을 분석하는 leave-out 벤치마크 · surrogate 소형 MLP</div>
<div class="flow">
<div class="fl1">
<span class="node">train pool<br />(전체의 75%)</span>
<span class="arr">➊ target 조건 클립<br /><b>ablation (leave-out)</b> ▶</span>
</div>
<div class="split2">
<div class="bx base"><b>base 학습셋</b><br />non-target 클립만 (<span class="hl">target 0개</span>)<br />→ <b>결핍 base 모델</b> (획득 전 baseline)</div>
<div class="bx cand"><b>candidate pool</b><br />ablation된 target 전부 <b>+ distractor 3×</b><br />(정책이 여기서 <b>800클립 획득</b>)</div>
</div>
<div class="fan">➋ 각 acquisition 정책이 candidate pool에서 <b>서로 다른 기준으로</b> <b>800클립 획득</b>(base에 add) + <b>개별 재학습</b> ↓</div>
<div class="pols">
<span class="chip">random</span><span class="chip">coverage</span><span class="chip">diversity</span><span class="chip">uncertainty</span><span class="chip g">Priority</span>
</div>
<div class="conv">➌ held-out test(<b>target 조건 포함</b>)에서 <b>ΔADE = 회복량(recovery)</b>으로 정책 랭킹</div>
</div>
<div class="note2 two">
<div>
<span class="h">ablation 대상 (2 시나리오)</span>
· <b>kinematic</b> = 고yaw 급기동 상위4%(<b>3,913</b>클립) → <b>실재 결핍 O(양성)</b> → 회복 측정 가능, Priority 최하위<br />
· <b>adverse</b> = snow∨fog(<b>3,228</b>클립) → <b>결핍 X(이미 잘 예측, 음성 대조)</b> → 회복 불가 = 실험 검증
</div>
<div>
<span class="h">선택 기준 (각 정책이 무엇으로 클립을 뽑나)</span>
coverage = ODD 조건 골고루(spread) · diversity = 기존 선택과 유사도 최저인 것 반복 선택(임베딩) · uncertainty = 오차 큰 클립 우선(per-clip ADE) · <span class="danger">Priority = 두 축 종합점수 높은 것(fusion) — 후보로 평가</span>
</div>
</div>
</div>
<div class="sec res">
<div class="lbl"><span class="tag">결과</span>이번 실험 근거강도별</div>
<div><span class="danger">✅ <b>coverage·diversity(공간 고루 덮기)가 회복 최상위</b></span> — <b>통계적으로 견고</b>(회복이 편차의 ~3배↑) · 오차 큰 클립만 고르거나(uncertainty) 두 축을 곱한 Priority는 그보다 낮음 · <b>Priority 꼴찌 = 곱셈-타게팅 융합 실패</b>(<span class="warn">일반 "융합 금지" 아님 — 스코프는 §2</span>)</div>
<div>✅ <b>시험한 ODD-조건(악천후)은 egomotion 결핍과 무관</b> — 악천후 클립을 빼도 성능 그대로지만, 급기동 클립을 빼면 성능 저하. 난이도는 <b>날씨가 아니라 기동축</b>에 있음 · <span class="warn">ODD 전체 일반화는 미검증(→perception)</span></div>
<div><span class="warn">▲ (가설) <b>오차 큰 클립 노리는 정책들</b>의 오차(ADE) 매기는 방식(그 클립 자신 / ODD-카테고리 / 닮은 장면) 중 <b>'닮은 장면(임베딩 이웃) 평균'</b>으로 매긴 쪽이 회복 조금 큼</span> — §2 참조. <b>※ 전체 1위는 ODD 기반 coverage — '임베딩&gt;ODD'라는 뜻 아님</b></div>
<div><span class="warn">📎 <b>두 축 "상호보완 → 함께 써야"는 미실증 가설</b></span> (ODD=수집·현실빈도, 임베딩=성능) — 직교는 확증이나 <b>가산성·비대체성은 미측정</b> → 실험 C로 검증(§4)</div>
<div><span class="warn">❓ ODD의 성능예측 역할 미검증</span> — condition-sensitive task(perception)으로 이관해 완성</div>
</div>
</div>
<blockquote>
<p>이 덱의 축은 <strong>&quot;Priority가 좋은가&quot;가 아니라 &quot;ODD·임베딩을 어떻게 써야 하는가&quot;</strong>. Priority(융합)는 그 답을 찾기 위해 <strong>시험대에 올린 귀무가설</strong>이며, 실제로 진다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="0--%ED%8C%8C%EC%9D%B4%ED%94%84%EB%9D%BC%EC%9D%B8--%EC%A7%84%EB%8B%A8phase-0-%E2%86%92-%EB%91%90-%EC%9E%A3%EB%8C%80-%ED%83%80%EB%8B%B9%EC%84%B1-%EC%A7%88%EB%AC%B8-%E2%86%92-%EC%A0%84%EB%9E%B5-%EA%B2%BD%EC%9F%81-%EA%B2%80%EC%A6%9D">0 · 파이프라인 — 진단(Phase 0) → 두 잣대 타당성 질문 → 전략 경쟁 검증</h2>
<div class="cols">
<div>
<p><strong>Phase 0</strong>: &quot;두 잣대(ODD·임베딩)는 직교&quot;를 기술적으로 확인(η²=21%, NN이 셀 경계 넘나듦).<br />
<strong>Phase 1</strong>: 그 둘을 <strong>어떻게 써야 하는지</strong>를, 여러 수집 전략을 경쟁시켜 실측한다.</p>
<p><strong>가설 → 검증 흐름</strong> (상세는 화살표 슬라이드)</p>
<table>
<thead>
<tr>
<th>단계</th>
<th>무엇을 · 어떻게</th>
<th style="text-align:center">상세</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>[가설] ① 융합안</strong></td>
<td>5인자 곱 = 클립별 <code>Priority</code> = 두 축을 한 점수로 <strong>곱한 순진한 가설</strong></td>
<td style="text-align:center">→4·8</td>
</tr>
<tr>
<td><strong>[검증] ② 빼기</strong></td>
<td>특정 조건(예: 고yaw) 클립을 학습셋서 <strong>통째 제거</strong> → 결핍 유발</td>
<td style="text-align:center">→10</td>
</tr>
<tr>
<td><strong>[검증] ③ 규칙</strong></td>
<td>각 잣대를 <strong>정책</strong>으로 — Priority 순 등으로 후보 선택(+대조 2종)</td>
<td style="text-align:center">→10</td>
</tr>
<tr>
<td><strong>[검증] ④ 성능</strong></td>
<td>학습형 MLP 재학습 → &quot;과거2초→미래3초&quot; 오차=ADE <strong>회복량</strong> 비교</td>
<td style="text-align:center">→6·11</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>핵심 구분</strong>: Priority <strong>값끼리 비교가 아니라</strong>, Priority로 고른 데이터가 재학습 후 <strong>ADE를 더 줄였는지</strong>(성능)로 판정 → 그래서 Priority(<code>guided</code>)가 <strong>최선이 아니어도, 그 한계의 원인이 수집 가이드 설계 원리를 준다.</strong></p>
</blockquote>
<p><strong>&quot;그 한계의 원인 → 설계 원리&quot;가 성립하는 근거</strong> (진단 장치가 &quot;졌다&quot;를 원리로 승격)</p>
<ul>
<li><strong>기계적 진단</strong>(<code>tail_picked</code>, →11): guided가 유용 클립을 23%만 집음(random 25% 이하) — 고yaw 급기동이 평범한 ODD조건에 살아 <strong>구조적으로 회피</strong>. 성능 노이즈가 아니라 <em>오조준의 원인</em>이 드러남 → 원리: <strong>성능신호를 ODD 셀에서 재지 말 것 · 두 축을 하나로 곱하지 말 것(융합 금지)</strong>.</li>
<li><strong>우연 배제</strong>: 음/양성 대조쌍 · 다중 seed(5)±std · S1 격리실험(→12)이 &quot;우연히 졌다&quot;를 걷어내 승패를 원리로 쓸 자격 부여.</li>
</ul>
</div>
<div>
<p><strong>성능 대리지표 = 예측오차(ADE) — 예측이 실제 경로에서 평균 몇 m 빗나갔나</strong><br />
라벨 없이 ego 궤적 자체를 GT로 삼아 &quot;과거 2초 → 미래 3초&quot; 궤적을 예측하고 실제 주행경로와 비교. 많이 빗나갈수록(ADE↑) 그 조건이 예측하기 어렵다는 뜻.</p>
<div class="kpi-row">

<div class="kpi"><div class="v">282</div><div class="l"><b>ODD 셀</b><br />valid의 94% 커버</div></div>
</div>

<div class="kpi"><div class="v">5</div><div class="l"><b>인자</b><br />Priority(c) 구성</div></div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="0--%EC%8B%9C%ED%97%98%EB%8C%80%EC%97%90-%EC%98%AC%EB%A6%B4-%EC%9C%B5%ED%95%A9-%EA%B0%80%EC%84%A4-priorityc--%EB%91%90-%EC%B6%95%EC%9D%84-%ED%95%9C-%EC%A0%90%EC%88%98%EB%A1%9C-%EA%B3%B1%ED%95%98%EB%A9%B4">0 · 시험대에 올릴 융합 가설 <code>Priority(c)</code> — 두 축을 한 점수로 곱하면?</h2>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>Priority</mtext><mo stretchy="false">(</mo><mi>c</mi><mo stretchy="false">)</mo><mo>=</mo><mtext>criticality</mtext><mo>×</mo><mtext>exposure</mtext><mo>×</mo><mtext>deficit</mtext><mo>×</mo><mtext>model_error</mtext><mo>×</mo><mtext>headroom</mtext></mrow><annotation encoding="application/x-tex">\text{Priority}(c)=\text{criticality}\times\text{exposure}\times\text{deficit}\times\text{model\_error}\times\text{headroom}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">Priority</span></span><span class="mopen">(</span><span class="mord mathnormal">c</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">criticality</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7778em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">exposure</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7778em;vertical-align:-0.0833em;"></span><span class="mord text"><span class="mord">deficit</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.0044em;vertical-align:-0.31em;"></span><span class="mord text"><span class="mord">model_error</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord text"><span class="mord">headroom</span></span></span></span></span></span></p><div class="cols">
<div>
<table>
<thead>
<tr>
<th>인자</th>
<th>의미</th>
<th>담당 잣대</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>criticality</strong></td>
<td>안전 심각도(사고·VRU·악천후)</td>
<td>ODD</td>
</tr>
<tr>
<td><strong>exposure</strong></td>
<td>현실 노출빈도 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mrow><mi>e</mi><mi>x</mi><mi>t</mi></mrow></msub></mrow><annotation encoding="application/x-tex">P_{ext}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">e</span><span class="mord mathnormal mtight">x</span><span class="mord mathnormal mtight">t</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></td>
<td>ODD + 기관통계</td>
</tr>
<tr>
<td><strong>deficit</strong></td>
<td>과/소수집 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><msub><mi>P</mi><mrow><mi>e</mi><mi>x</mi><mi>t</mi></mrow></msub><mi mathvariant="normal">/</mi><msub><mi>P</mi><mrow><mi>s</mi><mi>e</mi><mi>l</mi><mi>f</mi></mrow></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\log(P_{ext}/P_{self})</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0361em;vertical-align:-0.2861em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">e</span><span class="mord mathnormal mtight">x</span><span class="mord mathnormal mtight">t</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mord">/</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">se</span><span class="mord mathnormal mtight" style="margin-right:0.0197em;">l</span><span class="mord mathnormal mtight" style="margin-right:0.1076em;">f</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></td>
<td>ODD</td>
</tr>
<tr>
<td><strong>model_error</strong></td>
<td>이 조건에서 모델이 실제 틀리나</td>
<td>egomotion ADE/FDE</td>
</tr>
<tr>
<td><strong>headroom</strong></td>
<td>채울 값어치(비중복 여력)</td>
<td>임베딩</td>
</tr>
</tbody>
</table>
</div>
<div>
<p><strong>조립 = 정규화 → 곱 → 셀→클립</strong></p>
<ol>
<li><strong>정규화 [0,1]</strong> — criticality·exposure·deficit·headroom은 <strong>min-max</strong>, model_error는 <strong>가중 CDF</strong> → 스케일·부호 통일(deficit 음수도 흡수).</li>
<li><strong>곱(conjunctive)</strong> — 모든 인자가 높아야 우선(하나라도 낮으면 하향) = 위험·빈발·과소·모델실패·비중복이 <strong>겹치는</strong> 셀.</li>
<li><strong>셀→클립</strong> — 셀 점수(cell_context)를 클립 per-clip model_error에 곱해 <strong>클립 랭킹</strong>(leave-out <code>guided</code>).</li>
</ol>
</div>
</div>
<blockquote>
<p>셀 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi></mrow><annotation encoding="application/x-tex">c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span></span></span></span> = coarse <code>road_type\|weather\|fog</code> (exposure 결정공간이자 <strong>이름 있는</strong> 수집발주 단위). <strong>core</strong>=crit×ME×headroom(전 셀) · <strong>full</strong>=×exposure×deficit(P_ext 정의 셀만, →8). 방법론 배정 — <span class="danger">ODD 4인자·임베딩 headroom</span> — 을 Phase 1이 실측 검증.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-class="section" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" class="section" style="--header:EXP-003 Phase 1 · 획득함수 조립·검증;--class:section;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>

<h1 id="1--%EA%B0%9C%EB%B3%84-%EC%9E%A3%EB%8C%80%EA%B0%80-%EC%9D%98%EB%AF%B8%EC%9E%88%EB%8A%94-%EC%8B%A0%ED%98%B8%EC%9D%B8%EC%A7%80-%EC%A0%95%EB%8B%B9%ED%99%94">1 · 개별 잣대가 의미있는 신호인지 정당화</h1>
<h3 id="%EC%84%B1%EB%8A%A5%EC%8B%A0%ED%98%B8model_error-%ED%95%99%EC%8A%B5%ED%98%95-%EA%B2%A9%EC%83%81--%EB%B6%84%ED%8F%AC%EC%8B%A0%ED%98%B8exposure-%EC%86%90%EC%95%B5%EC%BB%A4-%ED%99%95%EC%9E%A5">성능신호(model_error) 학습형 격상 · 분포신호(exposure) 손앵커 확장</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="1--cv-%E2%86%92-%ED%95%99%EC%8A%B5%ED%98%95-%EC%98%88%EC%B8%A1%EA%B8%B0--model_error%EB%A5%BC-%EB%B6%84%ED%8F%AC-%EC%9D%98%EC%A1%B4-%EC%8B%A0%ED%98%B8%EB%A1%9C-%EA%B2%A9%EC%83%81">1 · CV → 학습형 예측기 — model_error를 &quot;분포 의존&quot; 신호로 격상</h2>
<div class="cols">
<div>
<p><strong>무엇</strong> — ego 궤적 &quot;과거 2초 → 미래 3초&quot; 예측(라벨 없이 <strong>궤적 자체가 GT</strong>). 오차(ADE)가 곧 그 조건의 예측 난이도.</p>
<p><strong>왜 CV→학습형 교체</strong> — CV는 클립별 자기적합 → 오차 = <em>&quot;기동 절대복잡도&quot;</em>. <strong>전역 MLP</strong>(fleet 평균 동역학)로 바꾸면 오차 = <span class="danger"><strong>&quot;fleet 기준 비전형성&quot;</strong></span> = 분포 의존 신호.</p>
<p><strong>누수 차단</strong> — GroupKFold <strong>OOF</strong>(클립 단위 분리, out-of-fold 예측만) → &quot;모델이 <strong>못 본</strong> 조건에서 틀린다&quot;가 성립(same-clip 창 누수 제거). 이게 model_error를 정당화.</p>
<table>
<thead>
<tr>
<th></th>
<th style="text-align:right">CV</th>
<th style="text-align:right">학습형</th>
</tr>
</thead>
<tbody>
<tr>
<td>ADE p50</td>
<td style="text-align:right">2.16</td>
<td style="text-align:right"><strong>0.94</strong></td>
</tr>
<tr>
<td>ADE p90</td>
<td style="text-align:right">4.35</td>
<td style="text-align:right">1.95</td>
</tr>
<tr>
<td>학습 창</td>
<td style="text-align:right">—</td>
<td style="text-align:right">676,624</td>
</tr>
</tbody>
</table>
</div>
<div>
<p><strong><code>model_error(c)</code></strong> = 학습형 per-clip ADE를 ODD 셀별 <strong>가중 CDF</strong>로 집계 = &quot;이 조건에서 모델이 실제 틀리나&quot;.</p>
<p><strong>검증</strong> — 학습형 vs CV 셀별 model_error <strong>Spearman 0.885</strong>(대체로 일치)이나, <strong>희소 셀</strong>(n≈25)에서 +0.5~0.67 급등:</p>
<div class="kpi-row">
<div class="kpi"><div class="v">0.885</div><div class="l"><b>Spearman</b><br />CV ↔ 학습형 (셀별)</div></div>
<div class="kpi"><div class="v">+0.67</div><div class="l"><b>최대 상승</b><br />희소 셀 (CV 저평가)</div></div>
</div>
<blockquote>
<p>CV는 클립별 적응이라 희소 동역학을 <strong>저평가</strong> → 전역모델은 못 배운 조건에서 실패 → ME↑. &quot;기동 복잡도&quot;가 아니라 &quot;<strong>조건 비전형성</strong>&quot;을 잰다.</p>
</blockquote>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="1--exposure%EB%A5%BC-urbanrural%EB%A1%9C-%ED%99%95%EC%9E%A5--%EC%86%90%EC%95%B5%EC%BB%A4--%EB%AF%BC%EA%B0%90%EB%8F%84-%EC%8A%A4%EC%9C%95">1 · exposure를 urban/rural로 확장 — 손앵커 + 민감도 스윕</h2>
<div class="cols">
<div>
<p><strong>지표</strong> — <code>deficit = log(P_ext / P_self)</code>. <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mrow><mi>e</mi><mi>x</mi><mi>t</mi></mrow></msub></mrow><annotation encoding="application/x-tex">P_{ext}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">e</span><span class="mord mathnormal mtight">x</span><span class="mord mathnormal mtight">t</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>=<strong>현실 노출빈도</strong>(기관통계), <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mrow><mi>s</mi><mi>e</mi><mi>l</mi><mi>f</mi></mrow></msub></mrow><annotation encoding="application/x-tex">P_{self}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">se</span><span class="mord mathnormal mtight" style="margin-right:0.0197em;">l</span><span class="mord mathnormal mtight" style="margin-right:0.1076em;">f</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span>=우리 데이터 자기분포. <strong>&gt;0 과소수집(→수집) / &lt;0 과대수집(→프루닝)</strong>.</p>
<p><strong>문제</strong> — <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mrow><mi>e</mi><mi>x</mi><mi>t</mi></mrow></msub></mrow><annotation encoding="application/x-tex">P_{ext}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">e</span><span class="mord mathnormal mtight">x</span><span class="mord mathnormal mtight">t</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> 출처 KTDB(교통량 통계)가 highway·national_road <strong>2/4등급만</strong> 조사(rural·urban 미조사).<br />
<strong>처방</strong> — 관측 hw:nr 비율 보존, 미조사 {trunk,urban,rural} 구성만 <strong>손앵커</strong>(통계연보 근사, 관측 아님) → 가정 바꾼 <strong>5앵커 민감도 스윕</strong>.</p>
<p><strong>road_type별 <code>deficit</code></strong> (앵커별):</p>

<p><strong>부호 안정성</strong> — 앵커를 흔들어도 결론이 뒤집히나:</p>

<h2 id="1--%EC%9C%B5%ED%95%A9-%EA%B0%80%EC%84%A4%EC%9D%98-%EC%B6%9C%EB%A0%A5--priority-%EB%9E%AD%ED%82%B9-%ED%95%99%EC%8A%B5%ED%98%95-me-%C3%97-%ED%99%95%EC%9E%A5-exposure-%E2%86%92-%C2%A72%EC%97%90%EC%84%9C-%EB%B0%98%EC%A6%9D">1 · 융합 가설의 출력 — Priority 랭킹 (학습형 ME × 확장 exposure) → §2에서 반증</h2>

<p><strong>exposure × model_error 충돌</strong>: highway는 과소수집(exposure↑)이나 예측 쉬움(ME↓) → 곱이 상쇄 = <em>&quot;더 안 모아도 됨&quot;</em>(정답). 최우선은 <span class="danger">빈발·과소수집·모델실패가 겹친 <code>urban·clear·present</code>(안개)</span>. <code>rural·snow·present</code>는 core 1위지만 exposure 희소라 full에선 내려감 — ΔRisk=빈도×심각도×오차 가중이 의도대로 작동.</p>

<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>

<h1 id="2--%EA%B5%AC%EC%B6%95-%EC%A0%84%EB%9E%B5-%EA%B2%BD%EC%9F%81--%EC%96%B4%EB%8A%90-%EC%84%A4%EA%B3%84%EA%B0%80-%EC%9D%B4%EA%B8%B0%EB%82%98">2 · 구축 전략 경쟁 — 어느 설계가 이기나</h1>
<h3 id="5%EA%B0%80%EC%A7%80-%EC%88%98%EC%A7%91-%EC%A0%84%EB%9E%B5%EC%9D%84-leave-out%EC%9C%BC%EB%A1%9C-%EA%B2%A8%EB%A4%84-%EC%84%A4%EA%B3%84-%EC%9B%90%EB%A6%AC%EB%A5%BC-%EB%8F%84%EC%B6%9C-priority%EB%8A%94-%EA%B7%B8%EC%A4%91-%ED%95%9C-%ED%9B%84%EB%B3%B4--%EC%88%9C%EC%A7%84%ED%95%9C-%EC%9C%B5%ED%95%A9%EC%95%88">5가지 수집 전략을 leave-out으로 겨뤄 <strong>설계 원리</strong>를 도출 (Priority는 그중 한 후보 = 순진한 융합안)</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="2--%EC%8B%A4%ED%97%98-%EC%84%A4%EA%B3%84--%ED%81%B4%EB%A6%BD%EC%9D%84-4%EB%B6%84%ED%95%A0%ED%95%B4-%EA%B2%B0%ED%95%8D-%E2%86%92-%EB%90%98%EB%A9%94%EC%9B%80-%E2%86%92-%ED%9A%8C%EB%B3%B5-%EC%B8%A1%EC%A0%95">2 · 실험 설계 — 클립을 4분할해 &quot;결핍 → 되메움 → 회복&quot; 측정</h2>
<div class="cols">
<div>
<p><strong>아이디어</strong>: 특정 조건을 학습셋에서 <strong>일부러 빼고</strong>(결핍), 정책이 후보에서 <strong>되메워</strong>(획득), 그 조건의 예측오차가 <strong>얼마나 회복되나</strong>로 정책을 채점. 테스트베드 = 학습형 예측기(<strong>surrogate = 소형 MLP</strong>(22→32→16→12, scikit-learn) — <strong>model_error 생성기(슬라이드 6)와 별개 · 정책마다 재학습</strong>, 입력 kinematics 6 + <strong>임베딩 PCA 16</strong> — 순수 kinematics면 조건축 학습 통로가 없어 전 정책 회복 실패, 임베딩이 장면조건 통로).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>clips-with-windows
├ test (25%, seed고정)  ── 전 정책 공통 평가셋
│                         회복은 test의 &quot;tail 영역&quot;에서만 측정
└ pool (75%)
   ├ tail = 결핍조건 클립 ─────────┐ 학습셋서 제거
   └ common                        ├→ candidate (정책이 픽)
      ├ 잉여(tail×3)=무용 미끼 ────┘
      └ 나머지 = base (tail 결핍 학습셋)
</code></pre>
<p><strong>회복 = ADE_base − ADE_add</strong> — 예산 B∈{0,400,800} 픽을 base에 add·재학습. baseline(B=0)=결핍 상태, 회복↑ = 그 정책이 결핍을 잘 채움.<br />
<strong>5 정책</strong> — 공통: 같은 pool·budget에서 <strong>정렬 상위 B개 add</strong>. <em>선택 기준만 다름</em>:</p>
<table>
<thead>
<tr>
<th>정책</th>
<th>선택 기준 (selection criterion)</th>
<th>계열</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>random</code></td>
<td><strong>무작위로 뽑음</strong></td>
<td>대조</td>
</tr>
<tr>
<td><code>coverage</code></td>
<td><strong>ODD 조건 골고루</strong>(셀 교대로 하나씩, round-robin)</td>
<td>spread</td>
</tr>
<tr>
<td><code>diversity</code></td>
<td><strong>기존 선택과 유사도 최저인 것 반복</strong>(임베딩 FPS)</td>
<td>spread</td>
</tr>
<tr>
<td><code>uncertainty</code></td>
<td><strong>오차 큰 클립 우선</strong>(per-clip ADE 내림차순)</td>
<td>오차 우선</td>
</tr>
<tr>
<td><code>guided</code>=Priority</td>
<td><strong>두 축 종합점수 높은 것</strong>(ODD맥락 × 오차)</td>
<td>오차 우선·<span class="danger">융합</span></td>
</tr>
</tbody>
</table>
</div>
<div>
<p><strong>통제 장치</strong> (도출의 합리성 근거)</p>
<table>
<thead>
<tr>
<th>장치</th>
<th>무엇을 막나</th>
</tr>
</thead>
<tbody>
<tr>
<td>음성/양성 <strong>대조쌍</strong></td>
<td>회복부재 vs 데이터부족 혼동</td>
</tr>
<tr>
<td><strong>다중 seed(5)</strong> ±std</td>
<td>단일 seed 우연</td>
</tr>
<tr>
<td><code>tail_picked</code></td>
<td>실패를 <em>선택 오조준</em>으로 인과규명</td>
</tr>
<tr>
<td><strong>mixed pool</strong>(tail+미끼)</td>
<td>정책 변별력 실제 시험</td>
</tr>
<tr>
<td>GroupKFold</td>
<td>same-clip 누수</td>
</tr>
</tbody>
</table>
<p><strong>두 시나리오 = 대조쌍</strong></p>
<div class="kpi-row">
<div class="kpi"><div class="v">adverse</div><div class="l">snow/fog · ODD축<br />baseline <b>0.916</b></div></div>
<div class="kpi"><div class="v">kinematic</div><div class="l">고yaw · feature축<br />baseline <b>0.984</b></div></div>
</div>
<blockquote>
<p>adverse는 baseline이 더 낮음(0.916&lt;0.984) = base가 tail을 이미 잘 예측 → <strong>결핍 부재</strong>. 되메워도 최고 정책조차 ≈0(결과 페이지) = 채울 게 없음의 직접 증거. 이 대비가 결론 ③.</p>
</blockquote>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-Y4BhAZG5="" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="2--%EA%B2%B0%EA%B3%BC--spread-%EC%A0%84%EB%9E%B5-%EC%8A%B9-%EC%9C%B5%ED%95%A9guided-%ED%8C%A8--tail_picked%EA%B0%80-%EB%B0%9D%ED%9E%8C-%EC%9D%B4%EC%9C%A0">2 · 결과 — spread 전략 승, 융합(guided) 패 · <code>tail_picked</code>가 밝힌 이유</h2>
<div class="cols">
<div>
<p><strong>kinematic — 급기동을 빼니 성능 저하 = 실재 결핍</strong> (baseline 0.984 · 후보 11,740 · budget 800) · 회복(=오차 감소량) 평균±편차:</p>
<table>
<thead>
<tr>
<th>정책</th>
<th style="text-align:right">회복</th>
<th style="text-align:right">tail 집음</th>
</tr>
</thead>
<tbody>
<tr>
<td>coverage (ODD spread)</td>
<td style="text-align:right"><strong>+0.061 ± 0.021</strong></td>
<td style="text-align:right">50%</td>
</tr>
<tr>
<td>diversity (임베딩 spread)</td>
<td style="text-align:right"><strong>+0.060 ± 0.015</strong></td>
<td style="text-align:right">33%</td>
</tr>
<tr>
<td>random</td>
<td style="text-align:right">+0.044 ± 0.027</td>
<td style="text-align:right">25%</td>
</tr>
<tr>
<td>uncertainty (per-clip 오차)</td>
<td style="text-align:right">+0.019 ± 0.019</td>
<td style="text-align:right">29%</td>
</tr>
<tr>
<td><strong>guided</strong>(=Priority, ODD-조건)</td>
<td style="text-align:right"><span class="danger"><strong>+0.007 ± 0.019</strong></span></td>
<td style="text-align:right"><span class="danger"><strong>23%</strong></span></td>
</tr>
</tbody>
</table>
<p><strong>읽기</strong>: 공간 고루 덮기(coverage·diversity)가 공동 1위, 오차 큰 클립만 고른 정책(uncertainty·guided)은 <span class="danger">무작위(random)보다도 못함</span>. → 두 잣대는 &quot;고루 덮기&quot;로 쓸 때만 효과(결론 ④).</p>
</div>
<div>
<p><strong>왜 guided가 졌나 — <code>tail_picked</code>(유용 클립을 얼마나 골랐나)</strong><br />
guided가 정작 필요한 급기동 클립을 <span class="danger"><strong>23%만</strong></span> 집음 = 무작위(25%)보다도 낮음. 급기동은 평범한 ODD조건(맑은 도심·고속도로)에 섞여 있어 → guided의 ODD 점수가 낮아짐 → <strong>그 유용한 클립을 구조적으로 회피</strong> → 예산 낭비 → 꼴찌. <em>우연이 아니라 기계적 오조준</em>(결론 ②).</p>
<p><strong>adverse — 악천후를 빼도 성능 그대로 = 대조군</strong> (baseline 0.916 · 후보 9,684)</p>
<div class="kpi-row">
<div class="kpi danger"><div class="v">≈0</div><div class="l">전 정책 회복<br />(±0.004, 최고 정책도)</div></div>
</div>
<p>악천후를 빼도 성능이 안 나빠짐(baseline 낮음) → <strong>채울 결핍이 없어</strong> 어떤 정책도 회복 0. 진짜 데이터 부족이면 성능이 나빠졌어야 함. 즉 egomotion 난이도는 <strong>기동축에 있고 날씨(ODD-조건)와 무관</strong>(결론 ③).</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="2--s1-%ED%9B%84%EC%86%8D--guided-%EC%8B%A4%ED%8C%A8%EB%8A%94-%ED%8B%80%EB%A6%B0-%EC%B6%95%EC%9D%B8%EA%B0%80-%EC%98%A4%EC%B0%A8-%EC%9A%B0%EC%84%A0-%EA%B3%A0%EB%A5%B4%EA%B8%B0-%EC%9E%90%EC%B2%B4%EC%9D%B8%EA%B0%80">2 · S1 후속 — guided 실패는 &quot;틀린 축&quot;인가 &quot;오차 우선 고르기 자체&quot;인가</h2>
<div class="cols">
<div>
<p><strong>동기</strong>: 결과의 guided 실패에 <strong>서로 배타적인 두 설명</strong>이 붙어 있다 — 미격리 상태.</p>
<ul>
<li><strong>② (축)</strong>: 성능신호를 <em>ODD 셀</em>에서 재서 죽음 → 임베딩축에서 재면 산다</li>
<li><strong>④ (오차 우선)</strong>: 오차 큰 것만 고르기 <em>자체</em>가 나쁨 → 고루 덮기가 답</li>
</ul>
<p><strong>격리 실험</strong>: <code>leaveout.py</code>에 정책 2종 추가(같은 파이프라인·데이터, <strong>정책만 교체</strong>)</p>
<ul>
<li><code>emb_err_only</code>: per-clip ADE를 <strong>임베딩 k-NN(20) 평균</strong>으로 재배치 = 성능신호를 임베딩축에. ODD 무시.</li>
<li><code>guided_sep</code>: <code>emb_err × soft ODD([0.5,1] 넛지, 억제 불가)</code> = <strong>축분리 결합</strong>(guided 교정형)</li>
</ul>
</div>
<div>
<p><strong>무엇을 보면 무엇이 참인가</strong></p>
<table>
<thead>
<tr>
<th>관측</th>
<th>판정</th>
</tr>
</thead>
<tbody>
<tr>
<td>emb_err &gt; uncertainty</td>
<td>성능신호는 <strong>임베딩축</strong>(②)</td>
</tr>
<tr>
<td>guided_sep &gt; guided</td>
<td>ODD-셀 게이트가 범인, 축분리가 교정</td>
</tr>
<tr>
<td>guided_sep ≈ spread</td>
<td>결합이 승자 도달 = <strong>H2</strong>(축만 문제)</td>
</tr>
<tr>
<td>guided_sep ≪ spread</td>
<td>축 고쳐도 오차 우선 고르기 패배 = <strong>H1</strong>(고루 덮기만 유효)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>guided = per-clip 오차 × <strong>ODD-셀 context</strong>. 범인 후보 (a)context 게이트가 좋은 클립을 억제 (b)오차 축이 틀림 (c)오차 우선 고르기 자체 — 두 정책이 (a)(b)를 분리한다.</p>
</blockquote>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="2--s1-%EA%B2%B0%EA%B3%BC--%EA%B3%A0%EB%A3%A8-%EB%8D%AE%EA%B8%B0%EA%B0%80-1%EC%B0%A8-%EC%8A%B9%EB%B6%80--%EC%9E%84%EB%B2%A0%EB%94%A9%EC%B6%95-%EC%9A%B0%EC%84%B8%EB%8A%94-2%EC%B0%A8--%EA%B3%B1%EC%85%88-%EC%9C%B5%ED%95%A9-%ED%8C%A8">2 · S1 결과 — 고루 덮기가 1차 승부 · 임베딩축 우세는 2차 · 곱셈 융합 패</h2>
<div class="cols">
<div>
<p><strong>kinematic 7정책 회복</strong> (budget 800 · 5 seed):</p>
<table>
<thead>
<tr>
<th>정책</th>
<th>신호</th>
<th style="text-align:right">회복</th>
</tr>
</thead>
<tbody>
<tr>
<td>coverage</td>
<td>ODD spread</td>
<td style="text-align:right"><strong>+0.061</strong></td>
</tr>
<tr>
<td>diversity</td>
<td>임베딩 spread</td>
<td style="text-align:right"><strong>+0.060</strong></td>
</tr>
<tr>
<td>random</td>
<td>—</td>
<td style="text-align:right">+0.044</td>
</tr>
<tr>
<td>emb_err_only</td>
<td>오차·<strong>임베딩축</strong></td>
<td style="text-align:right">+0.038</td>
</tr>
<tr>
<td>guided_sep</td>
<td>emb_err×soft ODD</td>
<td style="text-align:right">+0.021</td>
</tr>
<tr>
<td>uncertainty</td>
<td>오차·원시축</td>
<td style="text-align:right">+0.019</td>
</tr>
<tr>
<td>guided(=Priority)</td>
<td>오차×<strong>ODD-셀</strong></td>
<td style="text-align:right"><span class="danger">+0.007</span></td>
</tr>
</tbody>
</table>
</div>
<div>
<p><strong>두 결과는 모순이 아니라 위계(1차 &gt; 2차)</strong></p>
<ul>
<li><strong>1차(지배적): 고루 덮기가 압승</strong>. coverage·diversity가 나머지 전부를 <strong>편차의 여러 배로</strong> 앞섬(견고). <span class="danger">오차 큰 클립만 고른 정책은 어느 축이든 무작위보다도 못하고</span>, 오직 고루 덮기만 무작위를 넘음.</li>
<li><strong>2차(부차적): 굳이 오차 큰 클립을 우선 고른다면 임베딩축이 나음</strong>. 오차 재는 <strong>축만 바꾼 두 쌍</strong>에서 임베딩 쪽이 회복 2~3배·방향 일치(아래 표). <em>단 차이가 <strong>편차 이내</strong>라 통계 미확정 = 방향성뿐.</em></li>
<li><strong>융합 금지</strong>: <span class="danger">두 축을 결합한 guided_sep(+.021)조차 단일 고루 덮기 diversity(+.060)에 못 미침</span> → 하나로 합치지 말고 <strong>각자 커버리지 도구로</strong>.</li>
</ul>
<p><strong>②의 근거 — 오차 재는 &quot;축&quot;만 바꾼 두 쌍</strong> (나머지 조건 동일 · 임베딩 쪽이 앞섬):</p>
<table>
<thead>
<tr>
<th>비교</th>
<th style="text-align:right">임베딩으로 잰 오차</th>
<th style="text-align:right">ODD·원시로 잰 오차</th>
</tr>
</thead>
<tbody>
<tr>
<td>오차만</td>
<td style="text-align:right">emb_err <strong>+0.038</strong></td>
<td style="text-align:right">uncertainty +0.019</td>
</tr>
<tr>
<td>오차 × ODD</td>
<td style="text-align:right">guided_sep <strong>+0.021</strong></td>
<td style="text-align:right">guided +0.007</td>
</tr>
</tbody>
</table>
<blockquote>
<p>정리: 오차 큰 클립 우선 고르기는 어느 축이든 고루 덮기에 진다(1차). 굳이 그렇게 한다면 임베딩축이 2~3배 낫다(2차).</p>
</blockquote>
</div>
</div>
</section>

<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>

<h1 id="3--%EC%A4%91%EA%B0%84%EA%B2%B0%EB%A1%A0">3 · 중간결론</h1>
<h3 id="odd%EC%9E%84%EB%B2%A0%EB%94%A9%EC%9D%84-%EC%96%B4%EB%96%BB%EA%B2%8C-%EC%8D%A8%EC%95%BC-%ED%95%98%EB%8A%94%EA%B0%80--%EA%B7%BC%EA%B1%B0-%EA%B8%B0%EB%B0%98-%EB%8F%84%EC%B6%9C">ODD·임베딩을 어떻게 써야 하는가 — 근거 기반 도출</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="3--%EA%B2%B0%EB%A1%A0-%E2%91%A0-%EC%97%AD%ED%95%A0%EB%B6%84%EB%8B%B4--%E2%91%A1-model_error%EC%9D%98-%EC%B6%95--%EA%B7%BC%EA%B1%B0%E2%86%92%EB%8F%84%EC%B6%9C%E2%86%92%EB%B0%98%EB%A1%A0%EB%B0%A9%EC%96%B4">3 · 결론 ① 역할분담 · ② model_error의 축 — 근거→도출→반론방어</h2>
<div class="cols">
<div>
<p><strong>① 두 잣대는 다른 질문에 답한다</strong> — ODD=분포·안전·주소 / 임베딩=성능·중복<br />
<strong>근거</strong> exposure 5앵커 부호안정(national 과소·rural 과대) — 외부앵커·명명 필요 → <strong>임베딩으론 원리적 산출 불가</strong>. + diversity 회복 1위(+0.060).<br />
<strong>도출</strong> ODD만 만드는 신호(노출·과소수집·이름)와 임베딩만 만드는 신호(실제 개선)가 <strong>각각 존재</strong> → 대체재 아닌 직교 축.<br />
<strong>방어</strong> <em>&quot;둘 다 그냥 다양성?&quot;</em> → 그렇다면 상호 대체돼야 하나 exposure는 임베딩에 앵커 없어 정의 불가, 성능회복은 ODD가 예측 실패(③). <strong>대체 불가 = 직교</strong>.</p>
</div>
<div>
<p><strong>② 성능신호는 ODD 셀 아닌 <span class="danger">임베딩 축</span>에 산다</strong> (2차 효과)<br />
<strong>근거</strong> guided(ODD셀×오차) 꼴찌 +0.007·tail 23%&lt;random 25%. S1: emb_err(+.038)&gt;uncertainty(+.019) ~2×, guided_sep(+.021)&gt;guided(+.007) ~2.8×.<br />
<strong>도출</strong> ODD셀로 집계하면 신호 소실, 임베딩서 쓰면 살아남 → 실패신호는 <strong>내용(임베딩)축에 조직</strong>. §2 배정 역전: <strong>임베딩-first로 찾고 ODD로 명명</strong>.<br />
<strong>방어</strong> <em>&quot;guided 패배는 운?&quot;</em> → tail 23%&lt;25%는 기계적 인과 — 고yaw가 평범한 ODD셀에 살아 cell_context↓ → <strong>구조적 회피</strong>. 재현가능.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="3--%EA%B2%B0%EB%A1%A0-%E2%91%A2-%EC%A1%B0%EA%B1%B4%EB%AC%B4%EA%B4%80%EC%84%B1--%E2%91%A3-spread-%EC%82%AC%EC%9A%A9%EB%AA%A8%EB%93%9C--%EA%B7%BC%EA%B1%B0%E2%86%92%EB%8F%84%EC%B6%9C%E2%86%92%EB%B0%98%EB%A1%A0%EB%B0%A9%EC%96%B4">3 · 결론 ③ 조건무관성 · ④ spread 사용모드 — 근거→도출→반론방어</h2>
<div class="cols">
<div>
<p><strong>③ ODD-조건은 egomotion 성능을 예측 못 한다</strong><br />
<strong>근거(대조)</strong> adverse(snow/fog): <strong>최고 정책조차 회복 ≈0</strong>(±0.004)=결핍 부재 / kinematic(고yaw): 실재 결핍 +0.06.<br />
<strong>도출</strong> &quot;adverse 결핍없음 / kinematic 결핍있음&quot; 대비 = egomotion 실패는 <strong>기동축</strong>, ODD-조건축과 직교.<br />
<strong>방어</strong> <em>&quot;adverse는 데이터 부족?&quot;</em> → cand 9,684·budget 800 충분. baseline 낮음(0.916) = 회복할 결핍이 없는 것. 부족이면 baseline↑이어야.</p>
</div>
<div>
<p><strong>④ spread로 이기고 오차 우선 고르기는 진다</strong> (<span class="danger">1차·지배</span>)<br />
<strong>근거</strong> 순위 coverage·diversity(~0.060) &gt; random &gt; 오차 우선 고르기(uncertainty·guided). S1: 오차 우선 고르기는 축 불문 <strong>random 이하</strong>, spread만 초과.<br />
<strong>도출</strong> 두 잣대는 공간을 <strong>폭넓게 덮는 커버리지 도구</strong>로 쓸 때 유효. 과가중(guided)=오조준, 오차추종(uncertainty)=환원불가 노이즈. guided_sep조차 spread 못미침 → <strong>융합 금지</strong>.<br />
<strong>방어</strong> <em>&quot;가중이 무의미?&quot;</em> → 아님. 가중은 실패축과 <strong>정렬됐을 때만</strong> 유효. egomotion선 정렬 깨져 커버리지 승 — 정렬 task선 가중이 이길 것(⑤).</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="3--%EA%B2%B0%EB%A1%A0-%E2%91%A4-%EB%AF%B8%EA%B2%80%EC%A6%9D-%EA%B2%BD%EA%B3%84--%ED%99%95%EC%A6%9D%EB%AF%B8%EA%B2%80%EC%A6%9D--%EC%9E%AC%ED%98%84%EC%84%B1">3 · 결론 ⑤ 미검증 경계 + 확증/미검증 · 재현성</h2>
<div class="cols">
<div>
<p><strong>⑤ ODD의 성능역할은 반증 아닌 <span class="warn">미검증</span></strong><br />
<strong>근거</strong> guided 실패 원인 = egomotion 실패축(기동)과 ODD-조건의 약한 연결 = <strong>구조적 핸디캡</strong>(②③).<br />
<strong>도출</strong> 확증한 것과 미검증을 반드시 구분(→표). condition-sensitive task(perception: 폐색·야간·악천후가 실제 성능저하)선 ODD 조건이 실패와 <strong>정렬</strong> → 성능역할 살아날 것으로 예측.<br />
<strong>방어</strong> <strong>반증이 아님</strong> — 실패 원인이 task 부적합(구조적 핸디캡)으로 규명됨. egomotion으론 볼 수 없어 이관.</p>
</div>
<div>
<p><strong>확증 vs 미검증 — 정직한 경계</strong></p>
<table>
<thead>
<tr>
<th></th>
<th>항목</th>
</tr>
</thead>
<tbody>
<tr>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 확증</td>
<td>ODD 분포·안전역할(exposure) · 임베딩 성능역할(diversity) · 두 축 직교</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> 미검증</td>
<td><strong>ODD 조건이 성능 예측</strong>(=두-잣대 G4) — perception으로 이관</td>
</tr>
</tbody>
</table>
<blockquote>
<p>각 결론이 특정 수치·대조에 묶여 <code>leaveout_results.json</code>·<code>exposure_sweep.json</code>으로 <strong>재현·추적 가능</strong>.</p>
</blockquote>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="3--%EA%B6%8C%EC%9E%A5-%EC%84%A4%EA%B3%84--%EC%9B%90%EB%A6%AC%EB%A5%BC-%EC%88%98%EC%A7%91-%EA%B0%80%EC%9D%B4%EB%93%9C-%EB%A0%88%EC%8B%9C%ED%94%BC%EB%A1%9C">3 · 권장 설계 — 원리를 &quot;수집 가이드 레시피&quot;로</h2>
<div class="cols">
<div>
<p><strong>핵심: 두 축을 분리 운용 (하나의 점수로 융합 금지)</strong></p>
<ol>
<li><strong>성능 커버 [임베딩축]</strong> — <code>diversity</code>(임베딩 spread)로 실패지점을 폭넓게 덮는다. 성능 신호(model_error)는 <strong>임베딩 이웃</strong>에서 측정.</li>
<li><strong>명명·발주 [ODD축]</strong> — <code>exposure</code>·<code>deficit</code>로 &quot;무엇을·왜&quot;(현실 노출·과소수집·안전)를 <strong>이름 붙여</strong> 수집 발주.</li>
<li><strong>spread &gt; 오차 우선 고르기</strong> — 고루 덮기가 이긴다. 심각도·오차로 <strong>과가중 금지</strong>.</li>
<li><strong>곱셈 융합 금지</strong> — 두 축을 <strong>한 점수로 곱하지</strong> 말 것(<code>guided</code>·<code>guided_sep</code> 패, S1). <span class="warn">단 일반 &quot;융합 금지&quot; 아님</span>: coverage⊕diversity <strong>결합(portfolio/층화)은 expB서 시험 → 이 무대선 무이득(H0)이나 반증도 아님</strong>. 결핍이 특정 조건에 정렬되면 타게팅이 이기는 반례도 존재(expA <code>speed_p4</code>).</li>
</ol>
</div>
<div>
<p><strong>각 항목의 근거</strong></p>
<table>
<thead>
<tr>
<th>레시피</th>
<th>근거</th>
</tr>
</thead>
<tbody>
<tr>
<td>성능 = 임베딩축</td>
<td>결론 ② · S1(emb_err↑)</td>
</tr>
<tr>
<td>명명 = ODD</td>
<td>결론 ①(exposure 부호안정)</td>
</tr>
<tr>
<td>spread &gt; 오차 우선 고르기</td>
<td>결론 ④ · S1(오차 우선 고르기 전부 random 이하)</td>
</tr>
<tr>
<td>곱셈 융합 금지</td>
<td>S1(guided_sep 패) · expB(결합도 H0·반증 아님)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>경계</strong>: ODD의 <strong>성능 역할</strong>은 아직 미검증 — condition-sensitive(perception)에서 정렬 기대. 여기 레시피는 <strong>egomotion으로 확증된 부분</strong>만.</p>
</blockquote>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-class="statement" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" class="statement" style="--header:EXP-003 Phase 1 · 획득함수 조립·검증;--class:statement;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>

<blockquote>
<p><strong>ODD</strong>는 <em>무엇을 수집할지</em>(현실·안전·이름)를, <strong>임베딩</strong>은 <em>그게 모델을 실제로 개선하는지</em>(성능·중복)를 담당한다 — 두 축의 <strong>직교성</strong>(η²·downstream)은 확증됐다.<br />
단, 성능 신호(<strong>model_error</strong>)는 <strong>ODD 셀이 아니라 임베딩 축</strong>에서 측정해 ODD로 명명해야 한다.</p>
<p><strong>&quot;함께 써야&quot;는 아직 결론이 아니라 <span class="warn">미실증 가설</span></strong> — 직교(≠)는 확증됐으나 <strong>상호 대체불가(non-substitutability)는 미측정</strong>, <strong>가산성(둘 다 &gt; 단일)은 egomotion에서 실증 못함</strong>(spread엔 한 렌즈로 충분·near-ceiling). 종결은 <strong>조건민감 task 가산성 실험(C)</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-class="section" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" class="section" style="--header:EXP-003 Phase 1 · 획득함수 조립·검증;--class:section;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>

<h1 id="4--%EC%83%81%ED%98%B8%EB%B3%B4%EC%99%84%EC%9D%80-%EC%97%B4%EB%A6%B0-%EA%B0%80%EC%84%A4--%EC%8B%A4%ED%97%98-%EB%A1%9C%EB%93%9C%EB%A7%B5">4 · 상호보완은 열린 가설 — 실험 로드맵</h1>
<h3 id="%ED%95%A8%EA%BB%98-%EC%8D%A8%EC%95%BC%EB%8A%94-egomotion%EC%9C%BC%EB%A1%9C-%EB%8B%AB%ED%9E%88%EC%A7%80-%EC%95%8A%EB%8A%94%EB%8B%A4--de-riskingab-%EC%99%84%EB%A3%8C-%E2%86%92-%EC%A2%85%EA%B2%B0%EC%9D%80-%EC%8B%A4%ED%97%98-c">&quot;함께 써야&quot;는 egomotion으로 닫히지 않는다 · de-risking(A·B) 완료 → 종결은 실험 C</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="4--de-risking-%EA%B2%B0%EA%B3%BC--expa%EC%99%B8%EC%A0%81%ED%83%80%EB%8B%B9%EC%84%B1--expb%EA%B2%B0%ED%95%A9-%EC%8A%A4%EC%BD%94%ED%94%84">4 · de-risking 결과 — expA(외적타당성) · expB(결합 스코프)</h2>
<div class="cols">
<div>
<p><strong>실험 A — ablation 배터리</strong> (결핍 21종 → 실재 14종, 5 seed)</p>
<ul>
<li><strong>재현성</strong>: <code>spread&gt;targeting</code> <strong>11/14</strong> · <code>guided_loses</code> <strong>11/14</strong> → 기존 결론이 &quot;고yaw 한 점&quot;이 아님(외적타당성 확보).</li>
<li><strong>경계(반례)</strong>: <span class="danger"><code>speed_p4</code>에서 guided 압승(+0.067)</span> → <strong>&quot;타게팅 항상 패&quot;는 거짓</strong> · 결핍이 조건에 정렬되면 타게팅 유효.</li>
<li><strong>견고성</strong>: capacity (32,16)·(128,64) 모두 spread 견고((16,)는 전정책 ≈0 붕괴구간) · <strong>ODD one-hot +36dim 넣어도 coverage 1위</strong> → &quot;성능=임베딩축&quot;이 입력설계 귀결이라는 우려 기각.</li>
</ul>
</div>
<div>
<p><strong>실험 B — spread 결합</strong>(coverage⊕diversity, 이질 결핍)</p>
<ul>
<li>tail = <code>a_lat@p2</code>(div선호) + <code>speed@p8</code>(cov선호), worst-case 판정.</li>
<li><strong>결과 = H0</strong>: portfolio/층화가 단일 spread를 <strong>worst-case로 못 넘음</strong> · 곱셈(mult)만 대조.</li>
<li><strong>원인</strong>: 결핍별 cov≈div가 <strong>전역</strong>(유의 분리 0) → 반대선호쌍 자체가 없음.</li>
<li><strong>한계</strong>: baseline 불균형(2.76 vs 1.04)으로 worst-case가 A영역 지배(R2) → 정규화해도 비유의.</li>
</ul>
<blockquote>
<p><strong>함의</strong>: 성능(spread) 논거로는 &quot;함께 써야&quot;가 닫히지 않음 → <strong>exposure/명명 논거 + 실험 C</strong>에 의존.</p>
</blockquote>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-LtYmFD0X="" data-paginate="true" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;" data-marpit-pagination-total="24">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>
<h2 id="4--%EC%8B%A4%ED%97%98-%EB%A1%9C%EB%93%9C%EB%A7%B5-af--%EC%83%81%ED%98%B8%EB%B3%B4%EC%99%84%EC%9D%84-%EB%8B%AB%EC%9C%BC%EB%A0%A4%EB%A9%B4">4 · 실험 로드맵 A~F — 상호보완을 닫으려면</h2>

<table>
<thead>
<tr>
<th style="text-align:center">순서</th>
<th>실험</th>
<th>무엇을 닫나</th>
<th style="text-align:center">중요도</th>
<th style="text-align:center">상태</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong>A</strong></td>
<td>ablation 배터리(결핍 다양화)</td>
<td>순위결론 외적타당성</td>
<td style="text-align:center">★★★</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 완료</td>
</tr>
<tr>
<td style="text-align:center"><strong>B</strong></td>
<td>spread 결합(portfolio·층화 vs 곱셈)</td>
<td>&quot;융합 금지&quot; 사정거리</td>
<td style="text-align:center">★★☆</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 완료(H0)</td>
</tr>
<tr>
<td style="text-align:center"><strong>C</strong></td>
<td>조건민감 task(perception) <strong>가산성</strong></td>
<td><strong>(d) 상호보완 · ODD 성능역할</strong></td>
<td style="text-align:center">★★★</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="⬜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b1c.svg" data-marp-twemoji=""/> 핵심·미착수</td>
</tr>
<tr>
<td style="text-align:center"><strong>D</strong></td>
<td>다목적 평가(exposure 고유 outcome)</td>
<td>ODD 고유가치·(I) 발주</td>
<td style="text-align:center">★★☆</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="⬜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b1c.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td style="text-align:center"><strong>E</strong></td>
<td>비대체성 정량화(교차 누락)</td>
<td>(c) non-substitutability</td>
<td style="text-align:center">★★☆</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="⬜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b1c.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td style="text-align:center"><strong>F</strong></td>
<td>실규모(≈5천)·실모델 재현</td>
<td>규모·모델 외적타당성</td>
<td style="text-align:center">★★☆</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="⬜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b1c.svg" data-marp-twemoji=""/></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Wave 1(A·B) 완료</strong>: 현행 결론의 기반 점검 + &quot;융합 금지&quot; 스코프 확정 — 단 <strong>상호보완을 증명하진 못함</strong>(청소·de-risking). <strong>Wave 2 = C</strong>가 상호보완을 닫는 유일한 실험(ODD가 성능을 인과적으로 좌우하는 task 필요). egomotion은 임베딩 성능역할·exposure 과소수집(national 수집·rural 프루닝) 검증엔 유효.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-header="EXP-003 Phase 1 · 획득함수 조립·검증" data-theme="di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye" lang="en-US" style="--header:EXP-003 Phase 1 · 획득함수 조립·검증;--theme:di9jg1odtesxv72s6t9ankh9lonlh8bjcgf23zu86ye;">
<header>EXP-003 Phase 1 · 획득함수 조립·검증</header>

<h2 id="%EB%B6%80%EB%A1%9D--%EC%9A%A9%EC%96%B4-%EB%AF%B8%EB%8B%88%EC%82%AC%EC%A0%84">부록 · 용어 미니사전</h2>
<div class="cols">
<div>
<table>
<thead>
<tr>
<th>용어</th>
<th>정의</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>ADE / FDE</strong></td>
<td>예측 궤적이 실제 경로서 벗어난 평균/최종 거리(m)</td>
</tr>
<tr>
<td><strong>η² (에타²)</strong></td>
<td>Phase0 효과크기 — ODD가 임베딩 분산 설명 비율(21%)</td>
</tr>
<tr>
<td><strong>model_error(ME)</strong></td>
<td>이 조건서 모델이 실제 틀리는 정도(학습형 per-clip ADE의 셀 CDF)</td>
</tr>
<tr>
<td><strong>exposure <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mrow><mi>e</mi><mi>x</mi><mi>t</mi></mrow></msub></mrow><annotation encoding="application/x-tex">P_{ext}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">e</span><span class="mord mathnormal mtight">x</span><span class="mord mathnormal mtight">t</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></strong></td>
<td>현실 노출빈도(기관통계). <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mrow><mi>s</mi><mi>e</mi><mi>l</mi><mi>f</mi></mrow></msub></mrow><annotation encoding="application/x-tex">P_{self}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">se</span><span class="mord mathnormal mtight" style="margin-right:0.0197em;">l</span><span class="mord mathnormal mtight" style="margin-right:0.1076em;">f</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span>=데이터 자기분포</td>
</tr>
<tr>
<td><strong>deficit</strong></td>
<td><code>log(P_ext/P_self)</code> — 과(&gt;0)/소(&lt;0)수집</td>
</tr>
<tr>
<td><strong>criticality</strong></td>
<td>안전 심각도 승수(사고·VRU·악천후)</td>
</tr>
<tr>
<td><strong>headroom</strong></td>
<td>비중복 여력(mean uniqueness_weight)</td>
</tr>

<table>
<thead>
<tr>
<th>용어</th>
<th>정의</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>coarse 셀</strong></td>
<td><code>road_type|weather|fog</code> — 수집발주 단위</td>
</tr>
<tr>
<td><strong>cell_context</strong></td>
<td>Priority에서 ME 뺀 나머지(expo×crit×deficit×headroom)</td>
</tr>
<tr>
<td><strong>GroupKFold OOF</strong></td>
<td>클립 단위 분리·out-of-fold 예측 = 누수 차단</td>
</tr>
<tr>
<td><strong>FPS</strong></td>
<td>farthest-point sampling — 임베딩 최대거리 순 = diversity</td>
</tr>
<tr>
<td><strong>Domino</strong></td>
<td>density×error 집계(aggregate_error)</td>
</tr>
<tr>
<td><strong>손앵커</strong></td>
<td>미조사 구성을 통계연보로 손 근사(관측 아님)</td>
</tr>
<tr>
<td><strong>tail</strong></td>
<td>결핍 조건 영역(회복 측정 대상)</td>
</tr>
<tr>
<td><strong>G4</strong></td>
<td>&quot;ODD 조건이 성능을 예측&quot;(두-잣대 가설)</td>
</tr>
